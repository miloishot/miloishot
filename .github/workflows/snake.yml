name: Generate contribution snake

# Regenerates the snake animation the README points at. It renders to the
# `output` branch rather than `main`, so the profile's history stays readable.
# Both variants are monochrome to match the hero: white snake on near-black,
# black snake on near-white.
on:
  schedule:
    - cron: "0 18 * * *"   # daily, 02:00 SGT
  workflow_dispatch:        # and on demand, from the Actions tab
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Render the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=%23ffffff&color_dots=%230d0d0d,%23252525,%23484848,%238a8a8a,%23ededed
            dist/snake-light.svg?color_snake=%23000000&color_dots=%23fafafa,%23e4e4e4,%23b4b4b4,%236e6e6e,%23171717

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
