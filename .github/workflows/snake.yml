name: Generate contribution snake

# Regenerates the snake animation the README points at. It renders to the
# `output` branch rather than `main`, so the profile's history stays readable.
on:
  schedule:
    - cron: "0 18 * * *"   # daily, 02:00 SGT
  workflow_dispatch:        # and on demand, from the Actions tab
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Render the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
