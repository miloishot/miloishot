<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="kahweng — point of sale, payments, the odd desktop pet">
  <defs>
    <pattern id="gridL" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ededed" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowL" cx="50%" cy="0%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeRuleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topEdgeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="#ffffff"/>
  <rect width="1200" height="340" fill="url(#gridL)"/>
  <rect width="1200" height="340" fill="url(#glowL)"/>
  <rect x="0" y="0" width="1200" height="1" fill="url(#topEdgeL)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="64" y="96" fill="#787878" font-size="13" letter-spacing="4.5">MILOISHOT</text>

    <text x="64" y="176" fill="#000000" font-size="66" font-weight="600" letter-spacing="-1">kahweng</text>

    <rect x="64" y="206" width="620" height="1" fill="url(#fadeRuleL)"/>

    <text x="64" y="240" fill="#666666" font-size="15" letter-spacing="0.2">point of sale &#183; payments &#183; the odd desktop pet</text>

    <g transform="translate(64, 268)">
      <rect x="0"   y="0" width="176" height="42" rx="6" fill="#fafafa" stroke="#e2e2e2"/>
      <text x="88"  y="27" fill="#171717" font-size="12.5" letter-spacing="2" text-anchor="middle">INVOCO</text>

      <rect x="188" y="0" width="176" height="42" rx="6" fill="#fafafa" stroke="#e2e2e2"/>
      <text x="276" y="27" fill="#171717" font-size="12.5" letter-spacing="2" text-anchor="middle">SG &#183; MY</text>

