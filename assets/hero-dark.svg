<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="kahweng — point of sale, payments, the odd desktop pet">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="0%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="#000000"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="1" fill="url(#topEdge)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="64" y="96" fill="#8b8b8b" font-size="13" letter-spacing="4.5">MILOISHOT</text>

    <text x="64" y="176" fill="#ffffff" font-size="66" font-weight="600" letter-spacing="-1">kahweng</text>

    <rect x="64" y="206" width="620" height="1" fill="url(#fadeRule)"/>

    <text x="64" y="240" fill="#8b8b8b" font-size="15" letter-spacing="0.2">point of sale &#183; payments &#183; the odd desktop pet</text>

    <g transform="translate(64, 268)">
      <rect x="0"   y="0" width="176" height="42" rx="6" fill="#0a0a0a" stroke="#2a2a2a"/>
      <text x="88"  y="27" fill="#ededed" font-size="12.5" letter-spacing="2" text-anchor="middle">INVOCO</text>

      <rect x="188" y="0" width="176" height="42" rx="6" fill="#0a0a0a" stroke="#2a2a2a"/>
      <text x="276" y="27" fill="#ededed" font-size="12.5" letter-spacing="2" text-anchor="middle">SG &#183; MY</text>

      <rect x="376" y="0" width="176" height="42" rx="6" fill="#0a0a0a" stroke="#2a2a2a"/>
      <text x="464" y="27" fill="#ededed" font-size="12.5" letter-spacing="2" text-anchor="middle">F&#38;B TECH</text>
    </g>
  </g>
</svg>
